[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bugmind"
version = "0.1.0"
description = "AI-powered bug intelligence CLI/TUI: analyze bugs, track recurring patterns, maintain backend prevention rules."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kiramido1" }]
keywords = ["qa", "bug-report", "tui", "claude-code", "opencode", "ai", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "textual>=8.0,<9",  # Select.NULL, TextSelected and the selection API
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Kiramido1/bugmind"
Issues = "https://github.com/Kiramido1/bugmind/issues"
Documentation = "https://github.com/Kiramido1/bugmind/tree/main/docs"

[project.scripts]
bugmind = "bugmind.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B904"]

[tool.hatch.build.targets.wheel]
packages = ["src/bugmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
