name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests
      - name: Test
        run: .venv/bin/python -m pytest

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ShellCheck
        run: uvx --from shellcheck-py shellcheck -s sh install.sh
      - name: Install from checkout
        run: ./install.sh && bugmind --version && bugmind --help >/dev/null
